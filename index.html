<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AYLERA</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

      :root {
        --ink: #1f3327;
        --ink-2: #16241c;
        --paper: #f6efdd;
        --paper-2: #ece1c4;
        --brass: #c89b3c;
        --rust: #b5482a;
        --charcoal: #2a2420;
        --sage: #7a9c80;
        --light: #fffdf9;
        --muted: #6d695f;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: 'Work Sans', sans-serif;
        background: radial-gradient(ellipse at top, var(--ink) 0%, var(--ink-2) 100%);
        color: var(--paper);
      }
      button, input, textarea { font: inherit; }
      #root { min-height: 100vh; }

      .app-shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 30px 18px 60px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
      }

      .brand {
        font-family: 'Fraunces', serif;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-size: clamp(2rem, 4vw, 3.2rem);
        margin: 0;
        color: var(--paper);
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .ghost-btn, .primary-btn, .small-btn, .danger-btn {
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.18s ease;
      }

      .ghost-btn {
        background: transparent;
        border: 1px solid var(--brass);
        color: var(--paper);
        padding: 10px 16px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .ghost-btn:hover { background: rgba(200, 155, 60, 0.12); }

      .primary-btn {
        background: var(--brass);
        color: var(--ink-2);
        border: none;
        padding: 11px 18px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-weight: 600;
      }

      .primary-btn:hover { filter: brightness(1.05); }

      .small-btn {
        border: 1px solid var(--rust);
        background: transparent;
        color: var(--rust);
        padding: 8px 12px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .small-btn:hover { background: rgba(181, 72, 42, 0.08); }

      .danger-btn {
        border: 1px solid var(--rust);
        background: var(--rust);
        color: #fff;
        padding: 8px 12px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .shop-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 24px;
      }

      .product-card {
        background: var(--paper);
        color: var(--charcoal);
        border: none;
        border-radius: 10px;
        box-shadow: 4px 6px 0 rgba(0,0,0,0.22);
        padding: 16px;
        text-align: left;
        cursor: pointer;
        transform: rotate(var(--tilt, 0deg));
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }

      .product-card:hover {
        transform: translateY(-4px) rotate(0deg);
        box-shadow: 6px 10px 0 rgba(0,0,0,0.28);
      }

      .product-image {
        width: 100%;
        height: 180px;
        border-radius: 8px;
        object-fit: cover;
        display: block;
        background: #f0ebdf;
      }

      .product-name {
        margin: 14px 0 6px;
        font-family: 'Fraunces', serif;
        font-size: 1.4rem;
      }

      .product-price {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.82rem;
        color: var(--ink);
        margin-bottom: 12px;
      }

      .card-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .card-actions .primary-btn,
      .card-actions .small-btn {
        flex: 1;
      }

      .panel {
        max-width: 960px;
        margin: 0 auto;
        background: var(--paper);
        color: var(--charcoal);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0,0,0,0.24);
      }

      .product-detail {
        display: grid;
        grid-template-columns: minmax(260px, 360px) minmax(320px, 1fr);
        gap: 30px;
        padding: 24px;
      }

      .detail-image {
        width: 100%;
        height: 100%;
        min-height: 360px;
        border-radius: 12px;
        object-fit: cover;
        background: #f5f1e7;
      }

      .detail-right {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .eyebrow {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--sage);
      }

      .detail-name {
        font-family: 'Fraunces', serif;
        font-size: clamp(2rem, 4vw, 2.8rem);
        margin: 0;
      }

      .detail-price {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 1.1rem;
        color: var(--ink);
      }

      .detail-blurb {
        margin: 0;
        line-height: 1.6;
        color: #4a4038;
      }

      .detail-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .detail-actions .primary-btn,
      .detail-actions .small-btn {
        min-width: 180px;
      }

      .custom-form {
        margin-top: 10px;
        display: grid;
        gap: 12px;
      }

      .field-label {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--sage);
      }

      .input,
      textarea {
        width: 100%;
        background: #fffdf9;
        border: 1.5px solid #d8cba9;
        border-radius: 8px;
        padding: 12px 14px;
        color: var(--charcoal);
        font-size: 0.98rem;
      }

      textarea { min-height: 90px; resize: vertical; }
      .input:focus, textarea:focus { outline: 2px solid rgba(200,155,60,0.25); border-color: var(--brass); }

      .cart-wrap, .checkout-wrap, .seller-wrap {
        max-width: 980px;
        margin: 0 auto;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
      }

      .section-title {
        font-family: 'Fraunces', serif;
        font-size: clamp(1.8rem, 3vw, 2.5rem);
        margin: 0;
      }

      .cart-items {
        display: grid;
        gap: 14px;
      }

      .cart-item {
        display: grid;
        grid-template-columns: 90px 1fr auto;
        gap: 16px;
        align-items: center;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        padding: 12px;
      }

      .cart-item img {
        width: 90px;
        height: 90px;
        object-fit: cover;
        border-radius: 10px;
        background: #f0ebdf;
      }

      .cart-item h4 {
        margin: 0 0 6px;
        font-family: 'Fraunces', serif;
        font-size: 1.25rem;
      }

      .cart-meta {
        color: var(--paper-2);
        font-size: 0.92rem;
      }

      .qty-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .qty-button {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 1px solid var(--brass);
        background: transparent;
        color: var(--paper);
        cursor: pointer;
      }

      .qty-value {
        min-width: 24px;
        text-align: center;
        font-family: 'IBM Plex Mono', monospace;
      }

      .cart-summary {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        padding: 18px 20px;
        margin-top: 18px;
      }

      .total-label {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        color: var(--sage);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .total-value {
        font-family: 'Fraunces', serif;
        font-size: 2rem;
      }

      .checkout-form {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        padding: 22px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .field.full { grid-column: 1 / -1; }

      .seller-pin-box {
        max-width: 540px;
        margin: 40px auto 0;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 16px;
        padding: 32px 22px;
        text-align: center;
      }

      .lock-icon {
        display: inline-flex;
        width: 52px;
        height: 52px;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: rgba(200,155,60,0.12);
        color: var(--brass);
        font-size: 1.7rem;
        margin-bottom: 12px;
      }

      .pin-row {
        display: flex;
        gap: 12px;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 18px;
      }

      .pin-input {
        width: 120px;
        text-align: center;
        letter-spacing: 0.3em;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 1.2rem;
      }

      .seller-orders-list {
        display: grid;
        gap: 12px;
      }

      .order-card {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        padding: 16px 18px;
        cursor: pointer;
        color: var(--paper);
      }

      .order-card:hover { background: rgba(255,255,255,0.07); }

      .order-topline {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 8px;
      }

      .order-name {
        font-family: 'Fraunces', serif;
        font-size: 1.3rem;
      }

      .order-status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 6px 10px;
        border-radius: 999px;
      }

      .pending {
        background: rgba(200,155,60,0.18);
        color: #f9d88a;
      }

      .completed {
        background: rgba(122,156,128,0.18);
        color: #cfe0cd;
      }

      .order-meta {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        color: var(--paper-2);
        font-size: 0.9rem;
      }

      .order-panel {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        padding: 20px;
      }

      .order-rows {
        display: grid;
        gap: 10px;
      }

      .order-row {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }

      .order-row:last-child { border-bottom: none; }

      .muted {
        color: var(--muted);
      }

      .empty-box {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        padding: 28px 20px;
        color: var(--paper-2);
        text-align: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        min-width: 18px;
        height: 18px;
        padding: 0 6px;
        font-size: 10px;
        background: var(--brass);
        color: var(--ink-2);
        font-family: 'IBM Plex Mono', monospace;
      }

      @media (max-width: 760px) {
        .product-detail { grid-template-columns: 1fr; }
        .form-grid { grid-template-columns: 1fr; }
        .topbar { flex-direction: column; align-items: flex-start; }
        .cart-item { grid-template-columns: 80px 1fr; }
        .cart-item > div:last-child { grid-column: 1 / -1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script>
      const SHOP_NAME = 'AYLERA';
      const SELLER_PIN = '2109';
      const CONTACT_EMAIL = 'amayrashah22.in@gmail.com';
      const PRODUCTS = [
        { id: 'travel-book', name: 'Travel Book', price: 1499, image: 'https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=900&q=80', blurb: 'A handcrafted journal for short escapes, itineraries, and everyday details.', customizable: false },
        { id: 'art-works', name: 'Art Prints', price: 1999, image: 'https://images.unsplash.com/photo-1515405295579-ba7b45403062?auto=format&fit=crop&w=900&q=80', blurb: 'Fine art-inspired pieces that add soul to walls and corners.', customizable: false },
        { id: 'rush-it', name: 'Rush It', price: 699, image: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=900&q=80', blurb: 'A playful desk companion for gifting, organizing, and brightening a routine.', customizable: false },
        { id: 'chocolate', name: 'Handcrafted Chocolate', price: 850, image: 'https://images.unsplash.com/photo-1511381939415-e44015466834?auto=format&fit=crop&w=900&q=80', blurb: 'Small-batch chocolate made for gifting and slow moments.', customizable: false },
        { id: 'lip-balms', name: 'Lip Balms', price: 480, image: 'https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&w=900&q=80', blurb: 'Velvety essentials in soft natural tones for everyday care.', customizable: false },
        { id: 'bookmarks', name: 'Bookmarks', price: 420, image: 'https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&w=900&q=80', blurb: 'Custom-made bookmarks with a personal flourish for your favorite reads.', customizable: true },
        { id: 'clean-spray', name: 'Clean Spray', price: 950, image: 'https://images.unsplash.com/photo-1556228578-8c89e6adf883?auto=format&fit=crop&w=900&q=80', blurb: 'Fresh and gentle home fragrance for a naturally calm feel.', customizable: false },
        { id: 'flower-perfume', name: 'Flower Perfume', price: 1299, image: 'https://images.unsplash.com/photo-1528740561666-dc2479dc08ab?auto=format&fit=crop&w=900&q=80', blurb: 'A floral scent layered with airy notes and everyday charm.', customizable: false },
        { id: 'bracelets', name: 'Bracelets', price: 1700, image: 'https://images.unsplash.com/photo-1617038220319-276d3cfab638?auto=format&fit=crop&w=900&q=80', blurb: 'Lightweight wearable pieces with an elegant handmade finish.', customizable: false },
        { id: 'trinket-tray', name: 'Trinket Tray', price: 2200, image: 'https://images.unsplash.com/photo-1503602642458-232111445657?auto=format&fit=crop&w=900&q=80', blurb: 'A personalized tray for keeping your everyday keepsakes together.', customizable: true }
      ];

      const CART_KEY = 'aylera-cart';
      const ORDER_KEY = 'aylera-orders';

      function formatINR(value) {
        return '₹' + Number(value).toLocaleString('en-IN');
      }

      function loadCart() {
        try {
          const raw = localStorage.getItem(CART_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch {
          return [];
        }
      }

      function saveCart(items) {
        try {
          localStorage.setItem(CART_KEY, JSON.stringify(items));
        } catch (e) {
          console.warn('Could not save cart', e);
        }
      }

      function loadOrders() {
        try {
          const raw = localStorage.getItem(ORDER_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch {
          return [];
        }
      }

      function saveOrders(orders) {
        try {
          localStorage.setItem(ORDER_KEY, JSON.stringify(orders));
        } catch (e) {
          console.warn('Could not save orders', e);
        }
      }

      function createOrderId() {
        return 'AYL-' + Date.now().toString(36).toUpperCase();
      }

      function App() {
        const [view, setView] = React.useState('shop');
        const [selectedProduct, setSelectedProduct] = React.useState(null);
        const [cart, setCart] = React.useState(loadCart());
        const [checkoutForm, setCheckoutForm] = React.useState({
          fullName: '',
          email: '',
          phone: '',
          address: ''
        });
        const [customText, setCustomText] = React.useState('');
        const [customImage, setCustomImage] = React.useState('');
        const [orders, setOrders] = React.useState(loadOrders());
        const [sellerPin, setSellerPin] = React.useState('');
        const [sellerUnlocked, setSellerUnlocked] = React.useState(false);
        const [selectedOrder, setSelectedOrder] = React.useState(null);

        React.useEffect(() => { saveCart(cart); }, [cart]);
        React.useEffect(() => { saveOrders(orders); }, [orders]);

        const cartTotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
        const pendingOrders = orders.filter((order) => order.status === 'pending').length;

        function addToCart(product) {
          const cartItem = {
            id: product.id + '-' + Date.now(),
            productId: product.id,
            name: product.name,
            price: product.price,
            image: product.image,
            quantity: 1,
            customization: customText || customImage ? {
              text: customText,
              image: customImage
            } : null
          };

          setCart((prev) => {
            const existing = prev.find((item) => item.productId === product.id && JSON.stringify(item.customization || null) === JSON.stringify(cartItem.customization || null));
            if (existing) {
              return prev.map((item) => item.id === existing.id ? { ...item, quantity: item.quantity + 1 } : item);
            }
            return [...prev, cartItem];
          });

          setCustomText('');
          setCustomImage('');
          setSelectedProduct(null);
          setView('shop');
        }

        function updateQty(productId, delta) {
          setCart((prev) => prev.flatMap((item) => {
            if (item.id === productId) {
              const nextQty = item.quantity + delta;
              return nextQty > 0 ? [{ ...item, quantity: nextQty }] : [];
            }
            return [item];
          }));
        }

        function placeOrder() {
          if (!checkoutForm.fullName.trim() || !checkoutForm.email.trim() || !checkoutForm.phone.trim() || !checkoutForm.address.trim()) {
            return;
          }

          const order = {
            id: createOrderId(),
            createdAt: Date.now(),
            status: 'pending',
            customer: {
              fullName: checkoutForm.fullName.trim(),
              email: checkoutForm.email.trim(),
              phone: checkoutForm.phone.trim(),
              address: checkoutForm.address.trim()
            },
            items: cart.map((item) => ({ ...item })),
            total: cartTotal
          };

          setOrders((prev) => [order, ...prev]);
          setCart([]);
          setCheckoutForm({ fullName: '', email: '', phone: '', address: '' });
          setView('shop');
        }

        function toggleOrderStatus(orderId) {
          setOrders((prev) => prev.map((order) => {
            if (order.id !== orderId) return order;
            return { ...order, status: order.status === 'pending' ? 'completed' : 'pending' };
          }));
        }

        function handleUnlockSeller() {
          if (sellerPin === SELLER_PIN) {
            setSellerUnlocked(true);
            setSellerPin('');
          } else {
            setSellerPin('');
            alert('Wrong seller code.');
          }
        }

        const renderShop = () => (
          <>
            <div className="topbar">
              <h1 className="brand">{SHOP_NAME}</h1>
              <div className="top-actions">
                <button className="ghost-btn" onClick={() => setView('seller')}>Seller ledger {pendingOrders > 0 && <span className="badge">{pendingOrders}</span>}</button>
                <button className="primary-btn" onClick={() => setView('cart')}>Cart ({cart.length})</button>
              </div>
            </div>

            <div className="shop-grid">
              {PRODUCTS.map((product, index) => (
                <div key={product.id} className="product-card" style={{ '--tilt': ((index % 3) - 1) * 0.7 + 'deg' }}>
                  <img className="product-image" src={product.image} alt={product.name} />
                  <div className="product-name">{product.name}</div>
                  <div className="product-price">{formatINR(product.price)}</div>
                  <div className="card-actions">
                    {product.customizable ? (
                      <button className="small-btn" onClick={() => { setSelectedProduct(product); setView('product'); }}>Customize</button>
                    ) : (
                      <button className="primary-btn" onClick={() => { addToCart(product); }}>Add to cart</button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          </>
        );

        const renderProductDetail = () => {
          if (!selectedProduct) return null;
          const isCustom = selectedProduct.customizable;

          return (
            <div className="panel product-detail">
              <img className="detail-image" src={selectedProduct.image} alt={selectedProduct.name} />
              <div className="detail-right">
                <div className="eyebrow">No. {selectedProduct.id.toUpperCase()}</div>
                <h2 className="detail-name">{selectedProduct.name}</h2>
                <div className="detail-price">{formatINR(selectedProduct.price)}</div>
                <p className="detail-blurb">{selectedProduct.blurb}</p>

                {isCustom ? (
                  <div className="custom-form">
                    <div>
                      <div className="field-label">Customization details</div>
                      <textarea
                        value={customText}
                        onChange={(e) => setCustomText(e.target.value)}
                        placeholder="Add your custom text, name, color, size, or design notes..."
                      />
                    </div>

                    <div>
                      <div className="field-label">Upload reference image</div>
                      <input
                        className="input"
                        type="file"
                        accept="image/*"
                        onChange={(e) => {
                          const file = e.target.files && e.target.files[0];
                          if (!file) return;
                          const reader = new FileReader();
                          reader.onload = (ev) => setCustomImage(ev.target.result);
                          reader.readAsDataURL(file);
                        }}
                      />
                    </div>

                    {customImage && (
                      <img src={customImage} alt="custom preview" style={{ maxHeight: 180, width: 'auto', borderRadius: 10, objectFit: 'cover' }} />
                    )}
                  </div>
                ) : null}

                <div className="detail-actions">
                  <button className="primary-btn" onClick={() => {
                    if (isCustom) {
                      addToCart(selectedProduct);
                    } else {
                      addToCart(selectedProduct);
                    }
                  }}>
                    {isCustom ? 'Add customized item' : 'Add to cart'}
                  </button>
                  <button className="small-btn" onClick={() => { setSelectedProduct(null); setCustomText(''); setCustomImage(''); setView('shop'); }}>Back</button>
                </div>
              </div>
            </div>
          );
        };

        const renderCart = () => (
          <div className="cart-wrap">
            <div className="section-head">
              <h2 className="section-title">Your cart</h2>
              <button className="small-btn" onClick={() => setView('shop')}>Continue shopping</button>
            </div>

            {cart.length === 0 ? (
              <div className="empty-box">Your cart is empty.</div>
            ) : (
              <>
                <div className="cart-items">
                  {cart.map((item) => (
                    <div className="cart-item" key={item.id}>
                      <img src={item.image} alt={item.name} />
                      <div>
                        <h4>{item.name}</h4>
                        <div className="cart-meta">{formatINR(item.price)} each</div>
                        {item.customization && item.customization.text && <div className="cart-meta">Customization: {item.customization.text}</div>}
                        {item.customization && item.customization.image && <img src={item.customization.image} alt="custom item" style={{ width: 60, height: 60, objectFit: 'cover', borderRadius: 8, marginTop: 8 }} />}
                      </div>
                      <div>
                        <div className="qty-row">
                          <button className="qty-button" onClick={() => updateQty(item.id, -1)}>-</button>
                          <span className="qty-value">{item.quantity}</span>
                          <button className="qty-button" onClick={() => updateQty(item.id, 1)}>+</button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="cart-summary">
                  <div>
                    <div className="total-label">Subtotal</div>
                    <div className="total-value">{formatINR(cartTotal)}</div>
                  </div>
                  <button className="primary-btn" onClick={() => setView('checkout')}>Proceed to checkout</button>
                </div>
              </>
            )}
          </div>
        );

        const renderCheckout = () => (
          <div className="checkout-wrap">
            <div className="section-head">
              <h2 className="section-title">Checkout</h2>
              <button className="small-btn" onClick={() => setView('cart')}>Back to cart</button>
            </div>

            <div className="checkout-form">
              <div className="form-grid">
                <div className="field full">
                  <div className="field-label">Full name</div>
                  <input className="input" value={checkoutForm.fullName} onChange={(e) => setCheckoutForm({ ...checkoutForm, fullName: e.target.value })} placeholder="Enter full name" />
                </div>

                <div className="field">
                  <div className="field-label">Email</div>
                  <input className="input" type="email" value={checkoutForm.email} onChange={(e) => setCheckoutForm({ ...checkoutForm, email: e.target.value })} placeholder="Enter email" />
                </div>

                <div className="field">
                  <div className="field-label">Phone number</div>
                  <input className="input" type="tel" value={checkoutForm.phone} onChange={(e) => setCheckoutForm({ ...checkoutForm, phone: e.target.value })} placeholder="Enter phone number" />
                </div>

                <div className="field full">
                  <div className="field-label">Address</div>
                  <textarea value={checkoutForm.address} onChange={(e) => setCheckoutForm({ ...checkoutForm, address: e.target.value })} placeholder="Street, city, state, country, postal code" />
                </div>
              </div>

              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 16, marginTop: 20, flexWrap: 'wrap' }}>
                <div>
                  <div className="total-label">Total</div>
                  <div className="total-value" style={{ fontSize: '1.8rem' }}>{formatINR(cartTotal)}</div>
                </div>
                <button className="primary-btn" onClick={placeOrder} disabled={cart.length === 0}>Place order</button>
              </div>
            </div>
          </div>
        );

        const renderSeller = () => {
          if (!sellerUnlocked) {
            return (
              <div className="seller-wrap">
                <div className="seller-pin-box">
                  <div className="lock-icon">🔒</div>
                  <h2 className="section-title" style={{ marginBottom: 8 }}>Seller ledger</h2>
                  <div className="muted">Enter your code to access the order list</div>
                  <div className="pin-row">
                    <input
                      className="input pin-input"
                      type="password"
                      inputMode="numeric"
                      value={sellerPin}
                      onChange={(e) => setSellerPin(e.target.value.replace(/\D/g, '').slice(0, 4))}
                      placeholder="••••"
                    />
                    <button className="primary-btn" onClick={handleUnlockSeller}>Unlock</button>
                  </div>
                </div>
              </div>
            );
          }

          if (selectedOrder) {
            return (
              <div className="seller-wrap">
                <div className="section-head">
                  <h2 className="section-title">Order #{selectedOrder.id}</h2>
                  <button className="small-btn" onClick={() => setSelectedOrder(null)}>Back to orders</button>
                </div>

                <div className="order-panel">
                  <div className="order-topline">
                    <div className="order-name">{selectedOrder.customer.fullName}</div>
                    <span className={`order-status ${selectedOrder.status}`}>{selectedOrder.status}</span>
                  </div>

                  <div className="order-rows">
                    <div className="order-row"><span className="muted">Email</span><span>{selectedOrder.customer.email}</span></div>
                    <div className="order-row"><span className="muted">Phone</span><span>{selectedOrder.customer.phone}</span></div>
                    <div className="order-row"><span className="muted">Address</span><span>{selectedOrder.customer.address}</span></div>
                    <div className="order-row"><span className="muted">Date</span><span>{new Date(selectedOrder.createdAt).toLocaleString('en-IN')}</span></div>
                    <div className="order-row"><span className="muted">Order total</span><span>{formatINR(selectedOrder.total)}</span></div>
                  </div>

                  <div style={{ marginTop: 20 }}>
                    <h3 style={{ margin: '0 0 10px', fontFamily: 'Fraunces, serif' }}>Items</h3>
                    {selectedOrder.items.map((item) => (
                      <div key={item.id} className="order-row" style={{ padding: '10px 0' }}>
                        <span>
                          {item.name} × {item.quantity}
                          {item.customization && item.customization.text ? <div className="muted">Custom: {item.customization.text}</div> : null}
                        </span>
                        <span>{formatINR(item.price * item.quantity)}</span>
                      </div>
                    ))}
                  </div>

                  <div style={{ marginTop: 24, display: 'flex', justifyContent: 'flex-end' }}>
                    <button className={selectedOrder.status === 'pending' ? 'primary-btn' : 'small-btn'} onClick={() => toggleOrderStatus(selectedOrder.id)}>
                      {selectedOrder.status === 'pending' ? 'Complete order' : 'Reopen order'}
                    </button>
                  </div>
                </div>
              </div>
            );
          }

          return (
            <div className="seller-wrap">
              <div className="section-head">
                <h2 className="section-title">Seller ledger</h2>
                <button className="small-btn" onClick={() => { setSellerUnlocked(false); setSellerPin(''); }}>Lock</button>
              </div>

              {orders.length === 0 ? (
                <div className="empty-box">No orders yet.</div>
              ) : (
                <div className="seller-orders-list">
                  {orders.map((order) => (
                    <div key={order.id} className="order-card" onClick={() => setSelectedOrder(order)}>
                      <div className="order-topline">
                        <div className="order-name">{order.customer.fullName}</div>
                        <span className={`order-status ${order.status}`}>{order.status}</span>
                      </div>
                      <div className="order-meta">
                        <span>{order.customer.email}</span>
                        <span>{new Date(order.createdAt).toLocaleDateString('en-IN')}</span>
                      </div>
                      <div className="order-meta" style={{ marginTop: 8 }}>
                        <span>{order.items.length} item(s)</span>
                        <strong>{formatINR(order.total)}</strong>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        };

        return (
          <div className="app-shell">
            {view === 'shop' && renderShop()}
            {view === 'product' && renderProductDetail()}
            {view === 'cart' && renderCart()}
            {view === 'checkout' && renderCheckout()}
            {view === 'seller' && renderSeller()}
            {view === 'sellerOrders' && renderSeller()}

            {view !== 'seller' && view !== 'sellerOrders' && (
              <div style={{ textAlign: 'center', marginTop: 30 }}>
                <button className="ghost-btn" onClick={() => setView('seller')}>Seller ledger</button>
                <span style={{ margin: '0 10px', color: '#a8997e' }}>·</span>
                <a className="ghost-btn" href={'mailto:' + CONTACT_EMAIL} style={{ display: 'inline-block', textDecoration: 'none' }}>Mail us</a>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
  </body>
</html>
